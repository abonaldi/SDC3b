# Publish website/ to GitHub Pages.
# Requires Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy website

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the site data is present
        run: test -f website/data/index.js

      # Version the asset URLs with the commit, so browsers do not mix cached
      # files from an earlier deploy with the new page.
      - name: Stamp asset URLs with the commit
        run: |
          v=${GITHUB_SHA::7}
          sed -i \
            -e "s|<html lang=\"en\">|<html lang=\"en\" data-build=\"$v\">|" \
            -e "s|assets/style.css\"|assets/style.css?v=$v\"|" \
            -e "s|assets/app.js\"|assets/app.js?v=$v\"|" \
            website/index.html
          grep -c "?v=$v" website/index.html | grep -qx 2
          grep -q "data-build=\"$v\"" website/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
